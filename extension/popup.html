<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLM Prompt Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      color: #7dd3fc;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    textarea {
      width: 100%;
      height: 90px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 10px;
      font-size: 13px;
      resize: none;
      outline: none;
    }

    textarea:focus { border-color: #7dd3fc; }

    textarea::placeholder { color: #64748b; }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #0284c7; }
    button:disabled { background: #334155; cursor: not-allowed; }

    #result { margin-top: 14px; display: none; }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }

    .metric .value {
      font-size: 18px;
      font-weight: 700;
      color: #7dd3fc;
    }

    .metric .label {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 3px;
    }

    .quality-bar-wrap {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .quality-bar-wrap .title {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .bar-bg {
      background: #334155;
      border-radius: 999px;
      height: 10px;
      width: 100%;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    .quality-label {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 600;
    }

    .suggestions {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 12px;
    }

    .suggestions .title {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .suggestion-item {
      font-size: 12px;
      padding: 4px 0;
      color: #fbbf24;
      display: flex;
      gap: 6px;
    }

    .suggestion-item.good { color: #4ade80; }

    #status {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      margin-top: 8px;
    }

    #error {
      font-size: 12px;
      color: #f87171;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <h1>🔍 LLM Prompt Analyzer</h1>

  <textarea id="promptInput" placeholder="Type or paste your prompt here..."></textarea>
  <button id="analyzeBtn">🚀 Analyze Prompt</button>

  <div id="status"></div>
  <div id="error">⚠️ Make sure your API is running at localhost:8000</div>

  <div id="result">

    <!-- Metrics -->
    <div class="metrics">
      <div class="metric">
        <div class="value" id="inputTokens">—</div>
        <div class="label">Input Tokens</div>
      </div>
      <div class="metric">
        <div class="value" id="outputTokens">—</div>
        <div class="label">Output Tokens</div>
      </div>
      <div class="metric">
        <div class="value" id="qualityScore">—</div>
        <div class="label">Quality</div>
      </div>
    </div>

    <!-- Quality Bar -->
    <div class="quality-bar-wrap">
      <div class="title">Quality Score</div>
      <div class="bar-bg">
        <div class="bar-fill" id="qualityBar" style="width:0%"></div>
      </div>
      <div class="quality-label" id="qualityLabel"></div>
    </div>

    <!-- Suggestions -->
    <div class="suggestions">
      <div class="title">💡 Suggestions</div>
      <div id="suggestionsList"></div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
